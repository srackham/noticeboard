[tools]
go = "1.26.6"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.fmt]
description = "Format Go source"
run = "go fmt ./..."

[tasks.tidy]
description = "Verify and tidy module dependencies"
run = "go mod verify && go mod tidy"

[tasks.build]
description = "Build the ./noticeboard dev binary (no CGO)"
depends = ["tidy"]
env = { CGO_ENABLED = "0" }
run = "go build -o noticeboard ."

[tasks.dist]
description = "Build Linux and Windows (amd64) distribution binary and checksum files in dist/"
depends = ["tidy"]
env = { CGO_ENABLED = "0" }
usage = 'arg "<version>" help "Release tag, e.g. v1.2.3"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

die() { echo "error: $*" >&2; exit 1; }
v="$usage_version"

[[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || die "illegal version tag: $v"
git rev-parse -q --verify "refs/tags/$v" >/dev/null || die "local tag $v does not exist"
[[ "$(git rev-parse "$v^{commit}")" == "$(git rev-parse HEAD)" ]] || die "tag $v does not point at HEAD"
[[ -z "$(git status --porcelain)" ]] || die "dirty working directory"

if compgen -G "dist/noticeboard-$v-*" >/dev/null; then
  die "built version $v already exists"
fi

mkdir -p dist
trap 'rm -f dist/noticeboard-"$v"-* dist/checksums-$v-sha256.txt' ERR

GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "dist/noticeboard-$v-linux-amd64" .
GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "dist/noticeboard-$v-windows-amd64.exe" .
(cd dist && sha256sum "noticeboard-$v-linux-amd64" "noticeboard-$v-windows-amd64.exe" > checksums-$v-sha256.txt)
'''

[tasks.release]
description = "Publish a GitHub release with the Linux and Windows binaries"
usage = 'arg "<version>" help "Release tag, e.g. v1.2.3"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

die() { echo "error: $*" >&2; exit 1; }
v="$usage_version"

[[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || die "illegal version tag: $v"
git rev-parse -q --verify "refs/tags/$v" >/dev/null || die "local tag $v does not exist"

files=(
  "dist/noticeboard-$v-linux-amd64"
  "dist/noticeboard-$v-windows-amd64.exe"
  "dist/checksums-$v-sha256.txt"
)
for f in "${files[@]}"; do
  [[ -f $f ]] || die "missing artifact: $f (run 'mise run dist $v' first)"
done
(cd dist && sha256sum -c checksums-$v-sha256.txt) || die "checksum verification failed"

git push origin "refs/tags/$v"

gh release create "$v" \
  --draft \
  --title "$v" \
  --verify-tag \
  --generate-notes \
  "${files[@]}"
'''
