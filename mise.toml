[tools]
go = "1.26.6"

# Single source of truth for release artifact names (%s = version tag).
[env]
DIST_DIR = "dist"
DIST_LINUX = "noticeboard-%s-linux-amd64"
DIST_WINDOWS = "noticeboard-%s-windows-amd64.exe"
DIST_CHECKSUMS = "checksums-%s-sha256.txt"

[tasks.test]
description = "Run all tests"
run = "go vet ./... && go test ./..."

[tasks.test-short]
description = "Run non-browser tests"
run = "go vet ./... && go test -short ./..."

[tasks.test-browser]
description = "Run all in-browser tests"
run = "go test ./internal/web -run InBrowser -count=1 -v"

[tasks.fmt]
description = "Format Go source"
run = "go fmt ./..."

[tasks.tidy]
description = "Verify and tidy module dependencies"
run = "go mod verify && go mod tidy"

[tasks.build]
description = "Build the ./noticeboard dev binary (no CGO)"
depends = ["tidy", "test"]
env = { CGO_ENABLED = "0" }
run = "go build -o noticeboard ."

[tasks.dist]
description = "Build Linux and Windows (amd64) distribution binary and checksum files in dist/"
depends = ["tidy"]
env = { CGO_ENABLED = "0" }
usage = 'arg "<version>" help "Release tag, e.g. v1.2.3"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

die() { echo "error: $*" >&2; exit 1; }
v="$usage_version"

linux="$(printf "$DIST_LINUX" "$v")"
windows="$(printf "$DIST_WINDOWS" "$v")"
checksums="$(printf "$DIST_CHECKSUMS" "$v")"

[[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || die "illegal version tag: $v"
git rev-parse -q --verify "refs/tags/$v" >/dev/null || die "local tag $v does not exist"
[[ "$(git rev-parse "$v^{commit}")" == "$(git rev-parse HEAD)" ]] || die "tag $v does not point at HEAD"
[[ -z "$(git status --porcelain)" ]] || die "dirty working directory"

for f in "$linux" "$windows" "$checksums"; do
  [[ ! -e "$DIST_DIR/$f" ]] || die "built version $v already exists ($DIST_DIR/$f)"
done

mkdir -p "$DIST_DIR"
trap 'rm -f "$DIST_DIR/$linux" "$DIST_DIR/$windows" "$DIST_DIR/$checksums"' ERR

GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$DIST_DIR/$linux" .
GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$DIST_DIR/$windows" .
(cd "$DIST_DIR" && sha256sum "$linux" "$windows" > "$checksums")
'''

[tasks.release]
description = "Publish a GitHub release with the Linux and Windows binaries"
usage = 'arg "<version>" help "Release tag, e.g. v1.2.3"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

die() { echo "error: $*" >&2; exit 1; }
v="$usage_version"

linux="$(printf "$DIST_LINUX" "$v")"
windows="$(printf "$DIST_WINDOWS" "$v")"
checksums="$(printf "$DIST_CHECKSUMS" "$v")"

[[ $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || die "illegal version tag: $v"
git rev-parse -q --verify "refs/tags/$v" >/dev/null || die "local tag $v does not exist"

files=("$DIST_DIR/$linux" "$DIST_DIR/$windows" "$DIST_DIR/$checksums")
for f in "${files[@]}"; do
  [[ -f $f ]] || die "missing artifact: $f (run 'mise run dist $v' first)"
done
(cd "$DIST_DIR" && sha256sum -c "$checksums") || die "checksum verification failed"

git push origin "refs/tags/$v"

gh release create "$v" \
  --draft \
  --title "$v" \
  --verify-tag \
  --generate-notes \
  "${files[@]}"
'''
