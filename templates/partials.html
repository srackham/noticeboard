{{/* Shared partials. */}}

{{/* admin-sidebar renders the administration menu. Its argument is the active
     menu item: "administration", "clocks", "timezones", or "" for none. */}}
{{define "admin-sidebar"}}
  <nav class="admin-sidebar" aria-label="Administration menu">
    <ul>
      <li><a href="/admin" data-testid="menu-administration"{{if eq . "administration"}} aria-current="page"{{end}}>Administration</a></li>
      <li><a href="/clocks" data-testid="menu-clocks"{{if eq . "clocks"}} aria-current="page"{{end}}>Clocks</a></li>
      <li>
        <span class="menu-label" data-testid="menu-tables">Tables</span>
        <ul class="menu-sub">
          <li><a href="/admin/tables/timezones" data-testid="menu-timezones"{{if eq . "timezones"}} aria-current="page"{{end}}>timezones</a></li>
        </ul>
      </li>
      <li>
        <form hx-post="/admin/logout">
          <button type="submit" data-testid="logout">Log out</button>
        </form>
      </li>
    </ul>
  </nav>
{{end}}
